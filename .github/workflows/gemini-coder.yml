name: Gemini Auto Coder

on:
  issues:
    types: [labeled]

jobs:
  gemini-fix:
    if: github.event.label.name == 'gemini' && github.actor == 'GrisGreyler'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider
        run: |
          python -m pip install --upgrade pip
          pip install aider-chat

      - name: Run Aider with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -e
          PROMPT="$ISSUE_TITLE. $ISSUE_BODY"
          aider --model gemini/gemini-3.5-flash \
                --weak-model gemini/gemini-3.5-flash \
                --message "$PROMPT" \
                --no-auto-commits \
                --yes \
                custom_components/ugreen_powerroam/*.py \
                tests/*.py
          git diff --quiet && { echo "Aider made no changes"; exit 1; }

      - name: Commit and Push changes
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          git config --global user.name "Gemini Bot"
          git config --global user.email "gemini-bot@github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-fix by Gemini: $ISSUE_TITLE"
            git push
          fi
