name: Gemini Auto Coder

on:
  issues:
    types: [labeled]

jobs:
  gemini-fix:
    if: github.event.label.name == 'gemini' && github.actor == 'GrisGreyler'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider
        run: |
          python -m pip install --upgrade pip
          pip install aider-chat

      - name: Run Aider with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -e
          PROMPT="$ISSUE_TITLE. $ISSUE_BODY"
          aider --model gemini/gemini-3.5-flash \
                --weak-model gemini/gemini-3.5-flash \
                --message "$PROMPT" \
                --no-auto-commits \
                --yes \
                custom_components/ugreen_powerroam/*.py \
                tests/*.py
          git diff --quiet && { echo "Aider made no changes"; exit 1; }

      - name: Commit to a branch and open a PR
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "Gemini Bot"
          git config --global user.email "gemini-bot@github.com"
          git add custom_components tests
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          BRANCH="gemini/issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git commit -m "Auto-fix by Gemini: $ISSUE_TITLE"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Auto-fix by Gemini: $ISSUE_TITLE" \
            --body "Generated for #${ISSUE_NUMBER}. Review the diff before merging."
